<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Management Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #0d6efd;
        }
        .nav-link {
            color: white; /* White text */
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.2); /* Lighten on hover */
            color: white;
        }
        .nav-link.active {
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <div class="col-md-3 col-lg-2 sidebar p-4">
            <h3 class="text-white mb-4">CMP</h3>
            
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="/dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/expenses">
                        <i class="bi bi-cash-stack"></i> Manage Expenses
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/assets">
                        <i class="bi bi-box-seam"></i> Manage Assets
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/documents">
                        <i class="bi bi-file-earmark-text"></i> Manage Documents
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/settings">
                        <i class="bi bi-gear"></i> Settings
                    </a>
                </li>
            </ul>

            <hr class="text-white my-4">

            <a class="nav-link" href="/logout">
                <i class="bi bi-box-arrow-left"></i> Sign out
            </a>
        </div>

        <div class="col-md-9 col-lg-10 p-5">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>
</body>
</html>
